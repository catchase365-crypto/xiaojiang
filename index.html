<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核武器级销讲话术库 (终极优化版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --text-main: #00ff41; 
            --border: #008f11; 
            --card-bg: rgba(0, 20, 0, 0.9);
            --accent-red: #ff3333; 
            --accent-gold: #ffd700; 
        }
        
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 12px; 
            -webkit-font-smoothing: antialiased;
        }
        
        .header { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            max-width: 800px; 
            margin: 0 auto 10px auto; 
        }
        
        h2 { margin: 5px 0; text-align: center; text-shadow: 0 0 10px rgba(0,255,65,0.5); font-size: 22px; }
        
        input[type="text"] { 
            padding: 14px; 
            background: var(--bg); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 15px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        .reset-btn { background: rgba(255, 51, 51, 0.1); border: 1px dashed var(--accent-red); color: var(--accent-red); padding: 12px; cursor: pointer; text-align: center; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; }
        .import-btn { 
            background: var(--card-bg); 
            border: 1px dashed var(--text-main); 
            color: var(--text-main); 
            padding: 12px; 
            cursor: pointer; 
            text-align: center; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 14px;
        }

        /* 🆕 导航栏优化：支持长文本截断 */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 5px 0 15px 0;
            max-width: 1400px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 13px;
            max-width: 120px; /* 限制最大宽度 */
            overflow: hidden;
            text-overflow: ellipsis; /* 长标题变省略号 */
            flex-shrink: 0;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--text-main);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,255,65,0.8);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            max-width: 1400px; 
            margin: 0 auto; 
            grid-auto-rows: 65px; 
        }
        
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            word-break: break-all;
        }
        .chip:active { background: var(--border); color: #000; }
        .chip-idx { position: absolute; left: 2px; bottom: 0; font-size: 9px; opacity: 0.4; font-family: monospace; }

        /* 全屏模态层 */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 15px;
            box-sizing: border-box;
        }
        .modal-close { position: fixed; top: 15px; right: 15px; font-size: 24px; color: var(--text-main); z-index: 1001; cursor: pointer; background: #000; border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            margin-top: 30px;
        }
        
        .card-header { border-bottom: 1px dashed var(--border); padding-bottom: 12px; margin-bottom: 5px;}
        .card-title { font-size: 20px; font-weight: bold; color: #fff; line-height: 1.3; }
        .badge { display: inline-block; background: var(--border); color: #000; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 8px;}
        
        .section-title { font-size: 12px; color: #666; margin-bottom: 4px; font-weight: bold; }
        .desc { font-size: 14px; color: #ccc; line-height: 1.6; }
        .demo-box { background: rgba(255, 215, 0, 0.05); border-left: 4px solid var(--accent-gold); padding: 12px; font-size: 15px; color: var(--accent-gold); line-height: 1.6; white-space: pre-wrap; }
        .tips-box { background: rgba(255, 51, 51, 0.05); border: 1px solid rgba(255, 51, 51, 0.3); padding: 12px; border-radius: 6px; font-size: 13px; color: var(--accent-red); }
        
        button { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 15px; width: 100%; margin-top: 10px;}
        button:active { background: var(--text-main); color: #000; }
        
        #status { text-align: center; font-size: 12px; opacity: 0.8; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2>🎙️ 销讲核武器库</h2>
    <div id="status">正在检查本地潜意识数据库...</div>
    <button id="resetBtn" class="reset-btn" onclick="clearAndReload()">🧨 销毁当前库并重新导入</button>
    
    <label class="import-btn" id="uploadLabel">
        📂 导入 JSONL 数据包
        <input type="file" id="fileInput" accept=".jsonl" style="display: none;">
    </label>
    
    <input type="text" id="searchInput" placeholder="全库瞬时搜索...">
</div>

<div id="categoryTabs" class="category-tabs"></div>

<div class="grid" id="resultsGrid"></div>

<div id="modalOverlay">
    <div class="modal-close" onclick="closeModal()">✕</div>
    <div id="modalContent" style="max-width: 600px; margin: 0 auto;"></div>
</div>

<script>
let allCards = [];
let categoryList = [];
let currentCategory = '全部';

async function initDB() {
    const storedData = await localforage.getItem('sales_tactics_db');
    if (storedData) {
        allCards = storedData;
        document.getElementById('uploadLabel').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'block';
        document.getElementById('status').innerHTML = `✅ 已就绪：${allCards.length} 个杀招`;
        setupCategories();
    }
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (event) => {
        const lines = event.target.result.split('\n').filter(l => l.trim());
        const data = lines.map(l => JSON.parse(l));
        await localforage.setItem('sales_tactics_db', data);
        allCards = data;
        location.reload();
    };
    reader.readAsText(file);
});

function setupCategories() {
    const rawCats = [...new Set(allCards.map(c => c.c).filter(Boolean))];
    categoryList = ['全部', ...rawCats];
    
    const tabsContainer = document.getElementById('categoryTabs');
    categoryList.forEach(cat => {
        const btn = document.createElement('div');
        btn.className = 'tab-btn' + (cat === currentCategory ? ' active' : '');
        btn.innerText = cat;
        btn.onclick = () => {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndRender();
        };
        tabsContainer.appendChild(btn);
    });
    filterAndRender();
}

function filterAndRender(keyword = '') {
    let filtered = allCards;
    if (keyword) {
        filtered = allCards.filter(c => 
            (c.t && c.t.includes(keyword)) || (c.demo && c.demo.includes(keyword))
        );
    } else if (currentCategory !== '全部') {
        filtered = allCards.filter(c => c.c === currentCategory);
    }
    
    // 排序
    filtered.sort((a, b) => (a.t || '').localeCompare(b.t || '', 'zh-Hans-CN'));
    
    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    filtered.forEach((card, i) => {
        const div = document.createElement('div');
        div.className = 'chip';
        div.innerHTML = `<span class="chip-idx">${i+1}</span>${card.t || '未命名'}`;
        div.onclick = () => showDetail(card);
        grid.appendChild(div);
    });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    filterAndRender(e.target.value.trim());
});

function showDetail(card) {
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <div class="card">
            <div class="card-header">
                <div class="card-title">${card.t}</div>
                <div class="badge">${card.c}</div>
            </div>
            <div><div class="section-title">🧠 心理学逻辑</div><div class="desc">${card.desc}</div></div>
            <div><div class="section-title">🎙️ 实战话术</div><div class="demo-box">${card.demo}</div></div>
            <div class="tips-box"><b>⚠️ 禁忌:</b> ${card.tips}</div>
            <button onclick="copyTxt(this, \`${card.demo.replace(/`/g, '\\`')}\`)">复制话术</button>
        </div>`;
    document.getElementById('modalOverlay').style.display = 'block';
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

function copyTxt(btn, txt) {
    navigator.clipboard.writeText(txt).then(() => {
        btn.innerText = "✅ 已复制";
        setTimeout(() => btn.innerText = "复制话术", 1500);
    });
}

async function clearAndReload() {
    if (confirm('确定要彻底销毁当前本地数据库并重新导入吗？')) {
        await localforage.removeItem('sales_tactics_db');
        location.reload();
    }
}

window.onload = initDB;
</script>
</body>
</html>
